name: TMF Community Support System CI

# Run CI whenever code is pushed or a pull request is created.
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-check:
    name: Build and Check Project
    runs-on: ubuntu-latest

    steps:
      # Get the latest project code from GitHub.
      - name: Checkout repository
        uses: actions/checkout@v6

      # Install Node.js.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'

      # Install the exact dependency versions from package-lock.json.
      - name: Install dependencies
        run: npm ci

      # Run ESLint if the project has a lint script.
      - name: Run lint
        run: npm run lint --if-present

      # Build the React/TypeScript application.
      - name: Build application
        run: npm run build

      # Run tests if a test script exists.
      - name: Run tests
        run: npm test --if-present
