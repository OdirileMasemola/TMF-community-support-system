name: TMF Community Support System CI

# Run CI whenever code is pushed or a pull request is created.
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-check:
    name: Build and Check Project
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      # Get the latest project code from GitHub.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # Install the exact dependency versions from package-lock.json.
      - name: Install dependencies
        run: npm ci

      # Lint is informational for now: the repo has no eslint config file yet.
      - name: Run lint
        continue-on-error: true
        run: npm run lint --if-present

      # Build runs "tsc -b && vite build", so this type-checks and bundles.
      - name: Build application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      # Run tests only if a test script is defined.
      - name: Run tests
        run: npm run test --if-present
