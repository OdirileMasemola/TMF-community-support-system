name: TMF Community Support System CI

# Run CI whenever code is pushed or a pull request is created.
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# The web, api and mobile jobs run in parallel.
jobs:
  build-and-check:
    name: Build and Check Project
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      # Get the latest project code from GitHub.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # Install the exact dependency versions from package-lock.json.
      - name: Install dependencies
        run: npm ci

      # Lint is informational for now: the repo has no eslint config file yet.
      - name: Run lint
        continue-on-error: true
        run: npm run lint --if-present

      # Build runs "tsc -b && vite build", so this type-checks and bundles.
      - name: Build application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      # Run tests only if a test script is defined.
      - name: Run tests
        run: npm run test --if-present

  api:
    name: Build and Check API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The API requires Node.js 22.12 or newer (see api/package.json "engines").
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Test env values (dummy Supabase URL/key, no network calls) come from api/vitest.config.ts.
      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  mobile:
    name: Build and Check Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Expo SDK 54 / React Native 0.81 need Node.js 20.19.4 or newer.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Bundles the Android JavaScript (Metro + Hermes) to prove the app compiles.
      # No EAS account, signing or secrets needed. Output goes to mobile/dist (gitignored).
      - name: Bundle app (Expo export, Android)
        run: npx expo export --platform android
