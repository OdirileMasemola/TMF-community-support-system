name: Android APK

# Builds an installable Android APK and a Play Store bundle (AAB) from mobile/ and
# uploads both as workflow artifacts.
# Runs on demand and when mobile code changes on main. It is deliberately NOT run on
# pull requests: the existing CI workflow covers PR checks, and this build is slow.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

# A newer push to the same branch cancels an older, still-running build.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    # EXPO_PUBLIC_* values are inlined into the JavaScript bundle during the Gradle build,
    # so they must be present for the whole job. They are the public Supabase URL and
    # publishable key (the same values the app reads from mobile/.env.local).
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      # Optional Play upload key. When these are missing the build falls back to the debug key.
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      # Fail in seconds, with a clear message, instead of building an APK that cannot sign in.
      - name: Check required secrets
        working-directory: .
        run: |
          missing=""
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ]; then missing="$missing EXPO_PUBLIC_SUPABASE_URL"; fi
          if [ -z "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then missing="$missing EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"; fi
          if [ -n "$missing" ]; then
            echo "::error title=Missing repository secrets::Add these in GitHub (Settings > Secrets and variables > Actions > New repository secret):$missing"
            exit 1
          fi
          echo "Required secrets are set."

      - name: Checkout repository
        uses: actions/checkout@v4

      # Expo SDK 57 / React Native 0.86 need Node.js 22.13 or newer (same as the CI workflow).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      # React Native 0.86 builds with JDK 17.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Caches the Gradle wrapper and dependencies between runs.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Installed first so the config plugins in app.json resolve during prebuild.
      - name: Install dependencies
        run: npm ci

      # Generates the native android/ project from app.json (gitignored, never committed).
      - name: Generate Android project (Expo prebuild)
        run: npx expo prebuild --platform android --no-install

      # Writes the upload keystore from the secret and builds the signing flags.
      # The keystore only exists on the runner and is never committed.
      - name: Prepare release signing
        id: signing
        run: |
          if [ -n "$ANDROID_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            {
              echo "flags=-Pandroid.injected.signing.store.file=$RUNNER_TEMP/upload.jks -Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD -Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"
              echo "key=upload"
            } >> "$GITHUB_OUTPUT"
            echo "Signing with the Play upload key."
          else
            echo "key=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::No upload key secrets set, so the build is signed with the debug key and cannot go to the Play Store."
          fi

      # Installable APK for testing on a phone (arm64-v8a keeps the build time down)
      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a ${{ steps.signing.outputs.flags }}

      # App bundle for the Play Store, with every architecture included
      - name: Build release AAB
        working-directory: mobile/android
        run: ./gradlew bundleRelease --no-daemon ${{ steps.signing.outputs.flags }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tmf-mobile-apk-${{ steps.signing.outputs.key }}
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: tmf-mobile-aab-${{ steps.signing.outputs.key }}
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
